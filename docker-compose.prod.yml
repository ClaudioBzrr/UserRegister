# Production overrides — Traefik + TLS (Let's Encrypt), tuned runtime.
# docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env up -d --build
services:
  traefik:
    image: traefik:v2.11
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/traefik/:/data/
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${ADMIN_EMAIL}
      - --certificatesresolvers.le.acme.storage=/data/acme.json
    networks:
      - app-network

  server:
    restart: always
    build:
      context: ./server
      dockerfile: dockerfile
      target: production
    environment:
      - NODE_ENV=production
      - SERVER_PORT=${SERVER_PORT:-3000}
      - DATABASE_URL=file:/app/data/dev.db
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - sqlite_data:/app/data
    networks:
      - app-network

  web:
    restart: always
    build:
      context: ./web
      dockerfile: dockerfile
      target: production-stage
      args:
        - VITE_API_URL=/api    # baked into the bundle — different from dev!
    environment:
      - SERVER_UPSTREAM=http://server:${SERVER_PORT:-3000}
    networks:
      - app-network
    depends_on:
      server:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${APP_HOST}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=le"
      - "traefik.http.services.web.loadbalancer.server.port=80"